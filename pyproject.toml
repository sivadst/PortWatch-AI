[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portwatch-ai"
version = "1.0.0"
description = "Global Supply Chain Disruption Intelligence"
authors = [{ name = "PortWatch AI Team" }]

requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "polars>=0.19.0",
    "duckdb>=0.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.42.0",
    "mlflow>=2.5.0",
    "streamlit>=1.26.0",
    "plotly>=5.15.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.13.0",
    "structlog>=23.1.0",
    "slowapi>=0.1.0",
    "pyarrow>=13.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.28.0",
    "SQLAlchemy>=2.0.0",
    "holidays>=0.33"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests",
    "isort>=5.12.0",
    "pre-commit>=3.4.0",
    "jupyter>=1.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
