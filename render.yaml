services:
  - type: web
    name: portwatch-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: portwatch-db
          property: connectionString

databases:
  - name: portwatch-db
    databaseName: portwatch
    user: postgres
